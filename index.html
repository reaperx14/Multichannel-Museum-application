<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Museum dex — Prehistoric Hunter</title>
  <meta name="description" content="Explore the natural history museum like never before! Catch dinosaurs, fossils and ancient plants in this epic prehistoric adventure." />
  <meta name="theme-color" content="#F8F6F0" />

  <!-- Preconnect for font performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css?v=11" />
</head>
<body>

  <!-- Quick Switcher to Chronos 3D Tunnel -->
  <a href="/tunnel/" class="tunnel-switcher-pill" title="Switch to Chronos 3D Tunnel" style="position:fixed;top:16px;right:16px;z-index:99999;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(0,0,0,0.12);border-radius:24px;padding:8px 16px;font-family:'Nunito',system-ui,sans-serif;font-size:12.5px;font-weight:800;color:#1C1916;text-decoration:none;box-shadow:0 4px 18px rgba(0,0,0,0.15);transition:transform 0.2s,box-shadow 0.2s;">
    <span>🌀</span>
    <span>Chronos 3D Tunnel →</span>
  </a>

  <!-- Premium Device Frame for Browser Preview -->
  <div class="phone-container">
    <div class="phone-reflection"></div>
    <div id="app">
      <!-- All screen content is injected here by JS -->
      <div id="screen" role="main"></div>

      <!-- Bottom Navigation (shown on main screens) -->
      <nav id="bottom-nav" class="hidden" role="navigation" aria-label="Main Navigation">
        <button class="nav-item" id="nav-home" data-target="home" aria-label="Home">
          <span class="nav-icon">🏠</span>
          <span class="nav-label">Home</span>
        </button>
        <button class="nav-item" id="nav-hunt" data-target="hunt" aria-label="Hunt Zone">
          <span class="nav-icon">🔍</span>
          <span class="nav-label">Hunt</span>
        </button>
        <button class="nav-item" id="nav-index" data-target="index" aria-label="My Collection">
          <span class="nav-icon">📖</span>
          <span class="nav-label">Index</span>
        </button>
        <button class="nav-item" id="nav-achievements" data-target="achievements" aria-label="Achievements">
          <span class="nav-icon">🏆</span>
          <span class="nav-label">Awards</span>
        </button>
      </nav>
    </div>
    <!-- Bottom Home Indicator Bar for Phone Frame -->
    <div class="phone-home-indicator"></div>
  </div>

  <!-- Load data first, then the app logic -->
  <script src="data.js?v=11"></script>
  <script src="world-data.js?v=11"></script>
  <script src="app.js?v=11"></script>

</body>
</html>
